# Local development database: pnpm db:up
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: skiffr
      POSTGRES_PASSWORD: skiffr
      POSTGRES_DB: skiffr
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - skiffr-pg:/var/lib/postgresql/data

volumes:
  skiffr-pg:
