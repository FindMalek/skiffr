<!doctype html>
<meta charset="utf-8">
<title>edge cases</title>
<style>
  body { font: 14px sans-serif; max-width: 640px; margin: 16px auto; }
  input#outlined { outline: none !important; }
  .row { margin: 6px 0; }
  #unrelated { border: 1px solid #999; padding: 4px; }
</style>
<form onsubmit="event.preventDefault(); window.__submitted = true">
  <h3>Applicant</h3>
  <div class="row"><label for="a-name">Name</label> <input id="a-name" name="name"></div>
  <h3>Reference</h3>
  <div class="row"><label for="r-name">Name</label> <input id="r-name" name="name"></div>

  <h3>Details</h3>
  <div class="row"><label for="email">Email</label> <input id="email" type="email" maxlength="10"></div>
  <div class="row"><label for="salary">Salary</label> <input id="salary" type="number"></div>
  <div class="row"><label for="phone">Phone</label> <input id="phone" type="tel" maxlength="10"></div>
  <div class="row"><label for="born">Date of birth</label> <input id="born" type="date"></div>
  <div class="row"><label for="country">Country</label>
    <select id="country"><option value="0">Select one</option><option>Canada</option><option>United States</option></select></div>
  <div class="row"><label for="region">Region</label>
    <select id="region"><option>Canada</option><option selected>Quebec</option></select></div>
  <fieldset><legend>Do you need sponsorship?</legend>
    <label><input type="radio" name="sp" value="yes"> Yes</label>
    <label><input type="radio" name="sp" value="no" checked> No</label></fieldset>
  <div class="row"><label for="outlined">Outlined</label> <input id="outlined"></div>

  <div class="row"><label for="dept">Department</label> <input id="dept" role="combobox" autocomplete="off"></div>
  <div id="unrelated" role="listbox" aria-label="Recent"><div role="option" id="decoy">Engineering</div></div>

  <div class="row"><span id="own-label">Own editor</span><div id="own" aria-labelledby="own-label" contenteditable="true" style="border:1px solid #999;min-height:24px"></div></div>
  <div class="row"><span id="rev-label">Reverting editor</span><div id="rev" aria-labelledby="rev-label" contenteditable="true" style="border:1px solid #999;min-height:24px"></div></div>

  <div class="row"><label for="forge">Forge</label> <input id="forge"></div>
  <div class="row"><label><input type="checkbox" id="forgecb"> Forge checkbox</label></div>
</form>
<script>
  window.__submitted = false
  window.__state = () => ({ own: window.__own })
  const dept = document.getElementById("dept")
  window.__decoyClicked = false
  document.getElementById("decoy").addEventListener("click", () => { window.__decoyClicked = true })
  dept.addEventListener("click", () => {
    const menu = document.createElement("div")
    menu.id = "portal-menu"
    menu.innerHTML = '<div role="option">Design</div><div role="option">Sales</div>'
    document.body.append(menu)
    for (const option of menu.children) {
      option.addEventListener("click", () => { dept.value = option.textContent; menu.remove() })
    }
  })
  const own = document.getElementById("own")
  own.addEventListener("beforeinput", (event) => {
    event.preventDefault()
    window.__own = event.data
    own.textContent = event.data
  })
  const rev = document.getElementById("rev")
  rev.addEventListener("input", () => setTimeout(() => { rev.textContent = "" }, 0))
</script>
<script src="./entry.js"></script>
