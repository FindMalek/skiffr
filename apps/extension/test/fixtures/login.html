<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in to your careers account</title></head>
<body>
<h1>Sign in</h1>
<form action="#" method="post">
  <label for="u">Email</label><input id="u" type="email" name="email" autocomplete="username">
  <label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password">
  <label for="c">Company</label><input id="c" type="text" name="company">
  <button type="submit">Sign in</button>
</form>
</body></html>
