<!doctype html>
<meta charset="utf-8">
<title>lever markup</title>
<form id="application-form" onsubmit="event.preventDefault()">
  <ul>
    <li class="application-question resume">
      <label>
        <div class="application-label">Resume/CV<span class="required">&#x2731;</span></div>
        <div class="application-field">
          <div class="resume-upload"><span class="resume-upload-label">ATTACH RESUME/CV</span><input type="file" name="resume" id="resume-upload-input" class="application-file-input"></div>
        </div>
      </label>
    </li>
    <li class="application-question">
      <label>
        <div class="application-label">Full name<span class="required">&#x2731;</span></div>
        <div class="application-field"><input type="text" name="name" required></div>
      </label>
    </li>
    <li class="application-question">
      <label>
        <div class="application-label">Email<span class="required">&#x2731;</span></div>
        <div class="application-field"><input type="text" name="email" required></div>
      </label>
    </li>
    <li class="application-question">
      <label>
        <div class="application-label"><span>First name</span><span>Last name</span></div>
        <div class="application-field"><input type="text" name="split"></div>
      </label>
    </li>
  </ul>
</form>
<script src="./entry.js"></script>
