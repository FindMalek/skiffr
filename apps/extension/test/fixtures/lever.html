<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Acme - Senior Designer</title></head>
<body>
<div class="posting-headline"><h2>Senior Designer</h2></div>
<form id="application-form" action="#" method="post">
  <div class="application-question resume">
    <label><div class="application-label">Resume/CV</div>
    <input type="file" name="resume" id="resume-upload-input" style="opacity:0;position:absolute"><span>ATTACH RESUME/CV</span></label>
  </div>
  <div class="application-question"><label><div class="application-label">Full name</div><input type="text" name="name" required></label></div>
  <div class="application-question"><label><div class="application-label">Email</div><input type="email" name="email" required></label></div>
  <div class="application-question"><label><div class="application-label">Phone</div><input type="text" name="phone"></label></div>
  <div class="application-question"><label><div class="application-label">Current company</div><input type="text" name="org"></label></div>
  <div class="application-question"><label><div class="application-label">Additional information</div><textarea name="comments"></textarea></label></div>
  <button type="submit">Submit application</button>
</form>
</body></html>
