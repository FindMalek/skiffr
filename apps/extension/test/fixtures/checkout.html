<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Checkout</title></head>
<body>
<h1>Checkout</h1>
<form action="#" method="post">
  <input type="text" name="name" autocomplete="name" placeholder="Full name">
  <input type="email" name="email" placeholder="Email">
  <input type="tel" name="phone" placeholder="Phone">
  <input type="text" name="cardnumber" autocomplete="cc-number" placeholder="Card number">
  <input type="text" name="exp" autocomplete="cc-exp" placeholder="MM / YY">
  <button type="submit">Pay now</button>
</form>
</body></html>
