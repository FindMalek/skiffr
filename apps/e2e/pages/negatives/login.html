<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in - Acme</title></head>
<body>
<main>
  <h1>Sign in</h1>
  <form action="/submit?neg=login" method="post">
    <label for="login-email">Email</label><input id="login-email" type="email" name="email" autocomplete="username">
    <label for="login-password">Password</label><input id="login-password" type="password" name="password" autocomplete="current-password">
    <label><input type="checkbox" name="remember"> Remember me</label>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
