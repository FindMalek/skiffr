<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Senior Engineer @ Acme</title></head>
<body>
<div id="root">
  <div class="ashby-application-form-container">
    <form class="ashby-application-form" action="/submit?ats=ashby" method="post">
      <div class="ashby-application-form-section-container">
        <h2 class="ashby-application-form-section-header-title">Application</h2>
        <div class="ashby-application-form-field-entry">
          <label class="ashby-application-form-question-title" for="_systemfield_name">Name <span>*</span></label>
          <input id="_systemfield_name" name="_systemfield_name" type="text" placeholder="Type here..." required>
        </div>
        <div class="ashby-application-form-field-entry">
          <label class="ashby-application-form-question-title" for="_systemfield_email">Email <span>*</span></label>
          <input id="_systemfield_email" name="_systemfield_email" type="email" required>
        </div>
        <div class="ashby-application-form-field-entry">
          <label class="ashby-application-form-question-title" for="_systemfield_resume">Resume <span>*</span></label>
          <input id="_systemfield_resume" name="_systemfield_resume" type="file">
        </div>
        <div class="ashby-application-form-field-entry">
          <label class="ashby-application-form-question-title" for="b6b1f7c2-1a21-4c3a-9c55-0d1ad2c5a001">LinkedIn</label>
          <input id="b6b1f7c2-1a21-4c3a-9c55-0d1ad2c5a001" name="b6b1f7c2-1a21-4c3a-9c55-0d1ad2c5a001" type="text">
        </div>
        <div class="ashby-application-form-field-entry">
          <label class="ashby-application-form-question-title" for="b6b1f7c2-1a21-4c3a-9c55-0d1ad2c5a002">Where are you located?</label>
          <input id="b6b1f7c2-1a21-4c3a-9c55-0d1ad2c5a002" name="b6b1f7c2-1a21-4c3a-9c55-0d1ad2c5a002" type="text">
        </div>
        <div class="ashby-application-form-field-entry">
          <label class="ashby-application-form-question-title" id="ashby-q3">Are you authorized to work in the country you are applying from?</label>
          <fieldset aria-labelledby="ashby-q3" class="_yesno">
            <button type="button" role="radio" aria-checked="false" class="_option">Yes</button>
            <button type="button" role="radio" aria-checked="false" class="_option">No</button>
          </fieldset>
        </div>
        <div class="ashby-application-form-field-entry">
          <label class="ashby-application-form-question-title" for="b6b1f7c2-1a21-4c3a-9c55-0d1ad2c5a004">What are your salary expectations?</label>
          <textarea id="b6b1f7c2-1a21-4c3a-9c55-0d1ad2c5a004" name="b6b1f7c2-1a21-4c3a-9c55-0d1ad2c5a004"></textarea>
        </div>
      </div>
      <button type="submit" class="ashby-application-form-submit-button">Submit Application</button>
    </form>
  </div>
</div>
</body>
</html>
