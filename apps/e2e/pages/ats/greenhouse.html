<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Senior Engineer - Acme - Greenhouse</title></head>
<body>
<div id="app_body">
  <h1 class="app-title">Senior Engineer</h1>
  <div id="application">
    <form id="application_form" action="/submit?ats=greenhouse" method="post" enctype="multipart/form-data">
      <div id="main_fields">
        <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label><input id="first_name" name="job_application[first_name]" type="text" autocomplete="given-name" required></div>
        <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label><input id="last_name" name="job_application[last_name]" type="text" autocomplete="family-name" required></div>
        <div class="field"><label for="email">Email <span class="asterisk">*</span></label><input id="email" name="job_application[email]" type="text" autocomplete="email" required></div>
        <div class="field"><label for="phone">Phone</label><input id="phone" name="job_application[phone]" type="text" autocomplete="tel"></div>
        <div class="field"><label for="resume">Resume/CV <span class="asterisk">*</span></label><input id="resume" name="job_application[resume]" type="file"></div>
      </div>
      <div id="custom_fields">
        <div class="field"><label for="job_application_answers_attributes_0_text_value">LinkedIn Profile</label><input id="job_application_answers_attributes_0_text_value" name="job_application[answers_attributes][0][text_value]" type="text"></div>
        <div class="field"><label for="job_application_answers_attributes_1_text_value">Website</label><input id="job_application_answers_attributes_1_text_value" name="job_application[answers_attributes][1][text_value]" type="text"></div>
        <div class="field">
          <label for="job_application_answers_attributes_2_answer_selected_options_attributes_2_answer_choice_id">How did you hear about this job?</label>
          <select id="job_application_answers_attributes_2_answer_selected_options_attributes_2_answer_choice_id" name="job_application[answers_attributes][2][answer_selected_options_attributes][2][answer_choice_id]">
            <option value="">Please select</option><option value="1">LinkedIn</option><option value="2">Referral</option><option value="3">Job board</option><option value="4">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="job_application_answers_attributes_3_answer_selected_options_attributes_3_answer_choice_id">Will you now or in the future require sponsorship?</label>
          <select id="job_application_answers_attributes_3_answer_selected_options_attributes_3_answer_choice_id" name="job_application[answers_attributes][3][answer_selected_options_attributes][3][answer_choice_id]">
            <option value="">Please select</option><option value="1">Yes</option><option value="2">No</option>
          </select>
        </div>
        <div class="field"><label for="job_application_answers_attributes_4_text_value">Why do you want to work at Acme?</label><textarea id="job_application_answers_attributes_4_text_value" name="job_application[answers_attributes][4][text_value]" rows="5"></textarea></div>
      </div>
      <div id="demographic_questions">
        <div class="field"><label for="gender">Gender</label><select id="gender" name="job_application[gender]"><option value="">Please select</option><option value="1">Male</option><option value="2">Female</option><option value="3">Decline To Self Identify</option></select></div>
      </div>
      <input type="submit" id="submit_app" value="Submit Application">
    </form>
  </div>
</div>
</body>
</html>
