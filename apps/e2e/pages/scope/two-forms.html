<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply for Senior Engineer - Acme Careers</title></head>
<body>
<h1>Apply for Senior Engineer</h1>
<form id="part-one" action="/submit?part=1">
      <label for="first_name">First name</label> <input id="first_name" name="first_name" autocomplete="given-name"><br>
      <label for="last_name">Last name</label> <input id="last_name" name="last_name"><br>
      <label for="email">Email</label> <input id="email" name="email" type="email"><br>
      <button type="button">Next</button>
</form>
<form id="part-two" action="/submit?part=2">
      <label for="phone">Phone</label> <input id="phone" name="phone"><br>
      <label for="city">City</label> <input id="city" name="city"><br>
      <button type="submit">Submit application</button>
</form>
</body></html>
