name: preview

# Every same-repo pull request gets a preview of all apps on the self-hosted Dokploy: apps the pull request changes (or
# depends on) are built here and pushed to ghcr, the others run the production image (`main`) with the preview's own env.
# Each preview has its own postgres, its own S3 bucket, a seeded database and one sticky comment with the links and a test login.
# Skipped until the repo variable PREVIEW_ENABLED is "true". Setup and every variable: apps/docs/content/docs/previews.mdx.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

# a new push cancels the running one. Closing the pull request starts a run with every job skipped, which cancels
# the running one too (cleanup has its own group and never gets cancelled)
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  PR_NUMBER: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  plan:
    name: plan
    if: github.event.action != 'closed' && vars.PREVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      build: ${{ steps.plan.outputs.build }}
      has_build: ${{ steps.plan.outputs.has_build }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # what the pull request changes, dependents included. A downloaded package runs here, so this step has no secret.
      # Without an answer every app is built.
      - id: affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if npx --yes turbo@2.11.9 ls --affected --output=json > "$RUNNER_TEMP/affected.json"; then
            echo "file=$RUNNER_TEMP/affected.json" >> "$GITHUB_OUTPUT"
          fi
      - id: plan
        env:
          AFFECTED_FILE: ${{ steps.affected.outputs.file }}
          GITHUB_TOKEN: ${{ github.token }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
        run: node .github/scripts/preview.mjs plan ${AFFECTED_FILE:+--affected "$AFFECTED_FILE"}

  build:
    name: build ${{ matrix.app }}
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      # Same build args as the production build, so the layers cached by main are reused. The urls only feed seo
      # metadata, and the preview's robots already say noindex (DEPLOY_ENV is pr-<n> at run time).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/findmalek/skiffr-${{ matrix.app }}:${{ needs.plan.outputs.tag }}
          build-args: |
            TURBO_API=${{ vars.TURBO_API }}
            TURBO_TEAM=${{ vars.TURBO_TEAM }}
            WEB_URL=https://${{ vars.PRODUCTION_DOMAIN }}
            DOCS_URL=https://docs.${{ vars.PRODUCTION_DOMAIN }}
          secrets: ${{ secrets.TURBO_TOKEN && format('turbo_token={0}', secrets.TURBO_TOKEN) || '' }}
          cache-from: |
            type=gha,scope=${{ matrix.app }}
            type=gha,scope=${{ matrix.app }}-pr-${{ github.event.pull_request.number }}
          cache-to: type=gha,scope=${{ matrix.app }}-pr-${{ github.event.pull_request.number }},mode=max,ignore-error=true

  deploy:
    name: dokploy
    needs: [plan, build]
    if: always() && needs.plan.outputs.ready == 'true' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      deployments: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/scripts/preview.mjs up
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.plan.outputs.build }}
          BUILD_RESULT: ${{ needs.build.result == 'failure' && 'failure' || 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
          PREVIEW_CERT_RESOLVER: ${{ vars.PREVIEW_CERT_RESOLVER }}
          PREVIEW_MAX: ${{ vars.PREVIEW_MAX }}
          S3_ENDPOINT: ${{ vars.PREVIEW_S3_ENDPOINT }}
          S3_REGION: ${{ vars.PREVIEW_S3_REGION }}
          PREVIEW_S3_ACCESS_KEY_ID: ${{ secrets.PREVIEW_S3_ACCESS_KEY_ID }}
          PREVIEW_S3_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_S3_SECRET_ACCESS_KEY }}
          PREVIEW_GROQ_API_KEY: ${{ secrets.PREVIEW_GROQ_API_KEY }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
