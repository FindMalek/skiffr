name: backup

# Needs variables S3_BUCKET_PRODUCTION, S3_ENDPOINT, S3_REGION and secrets BACKUP_DATABASE_URL,
# S3_ACCESS_KEY_ID_PRODUCTION, S3_SECRET_ACCESS_KEY_PRODUCTION.
# Skipped until S3_BUCKET_PRODUCTION is set, so the nightly run does not fail red before production exists.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    if: vars.S3_BUCKET_PRODUCTION != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID_PRODUCTION }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY_PRODUCTION }}
      AWS_DEFAULT_REGION: ${{ vars.S3_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    steps:
      - name: Install postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Dump and upload
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BUCKET: ${{ vars.S3_BUCKET_PRODUCTION }}
          ENDPOINT: ${{ vars.S3_ENDPOINT }}
        shell: bash
        run: |
          file="db-$(date -u +%Y-%m-%d).sql.gz"
          pg_dump --no-owner --no-privileges "$DATABASE_URL" | gzip > "$file"
          aws s3 cp "$file" "s3://$BUCKET/backups/$file" --endpoint-url "$ENDPOINT"
