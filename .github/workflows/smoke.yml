name: smoke

# Opens real public application pages with the built extension and a mock api, fills them and never submits.
# Reports selector drift in one tracking issue (label `smoke`). Needs no secrets.
# Skipped until the repository variable SMOKE_ENABLED is "true", so merging this is safe.
# Only public pages, at a low frequency: see the docs page "Smoke tests".

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

concurrency:
  group: smoke
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  smoke:
    if: vars.SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      E2E_EXTENSION_DIR: ${{ github.workspace }}/apps/extension/.output/chrome-mv3
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter extension build
      - id: playwright
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Run the smoke targets
        id: run
        shell: bash
        run: |
          set +e
          pnpm --filter e2e smoke --out "$RUNNER_TEMP/smoke"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Show the summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/smoke/summary.md" ]; then
            cat "$RUNNER_TEMP/smoke/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke
          retention-days: 14
          if-no-files-found: ignore
      - name: Update the tracking issue
        if: always() && steps.run.outputs.code != '2'
        env:
          CODE: ${{ steps.run.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          summary="$RUNNER_TEMP/smoke/summary.md"
          [ -f "$summary" ] || exit 0
          body="$RUNNER_TEMP/smoke-issue.md"
          {
            cat "$summary"
            echo
            echo "run: $RUN_URL (traces are in the artifact)"
          } > "$body"
          number=$(gh issue list --label smoke --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$CODE" = "1" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$body"
            else
              gh label create smoke --color BFD4F2 --description "selector drift found by the smoke run" 2>/dev/null || true
              gh issue create --title "smoke: selector drift on real ats pages" --label smoke --body-file "$body"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
            gh issue close "$number"
          fi
      - name: Fail on drift
        if: steps.run.outputs.code != '0'
        run: exit 1
