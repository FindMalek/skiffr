name: ci

on:
  pull_request:
  push:
    branches: [main]

# Branch protection should require the `ci` job only. It aggregates the others.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  # a pr checkout has no local `main`, so turbo needs the base sha to resolve --affected
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

# pull requests only run tasks of changed packages and their dependents (--affected), main runs everything.
# a pr that touches .github/actions, .github/scripts or this file runs everything with --force, so a tool bump is really tested even when main has a cache.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flags: ${{ steps.scope.outputs.flags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          flag=""
          if [ "$EVENT" = "pull_request" ]; then
            if ! files=$(git diff --name-only "$BASE" HEAD); then
              flag="--force"
            elif echo "$files" | grep -Eq '^(\.github/(actions|scripts)/|\.github/workflows/ci\.yml$)'; then
              flag="--force"
            else
              flag="--affected"
            fi
          fi
          echo "flags=$flag" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  check-types:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/setup
        with:
          turbo: "true"
      - run: pnpm check-types ${{ needs.changes.outputs.flags }}
      - uses: ./.github/actions/save-cache
        with:
          setup: ${{ toJSON(steps.setup.outputs) }}
          turbo: "true"

  test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/setup
        with:
          bun: "true"
          turbo: "true"
      - run: pnpm test ${{ needs.changes.outputs.flags }}
      - uses: ./.github/actions/save-cache
        with:
          setup: ${{ toJSON(steps.setup.outputs) }}
          turbo: "true"

  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/setup
        with:
          turbo: "true"
          next-cache: "true"
      # fixed dummy secrets: .env is a turbo global input, random values would miss the cache every run
      - name: Write build env
        run: |
          cp .env.example .env
          printf 'BETTER_AUTH_SECRET=%s\nADMIN_PASSWORD=%s\n' "ci-build-secret-not-used-anywhere-0123456789" "ci-build-password" >> .env
      - run: pnpm build ${{ needs.changes.outputs.flags }}
      - uses: ./.github/actions/save-cache
        with:
          setup: ${{ toJSON(steps.setup.outputs) }}
          turbo: "true"
          next-cache: "true"

  extension:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
        with:
          turbo: "true"
      # always runs so every pr has a zip to test; an untouched extension is a turbo cache hit
      - run: pnpm zip --filter=extension ${{ needs.changes.outputs.flags == '--force' && '--force' || '' }}
      - uses: ./.github/actions/save-cache
        with:
          setup: ${{ toJSON(steps.setup.outputs) }}
          turbo: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: extension-chrome-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
          path: apps/extension/.output/*-chrome.zip
          retention-days: 14
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: extension-chrome-latest
          path: apps/extension/.output/*-chrome.zip
          retention-days: 90
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true

  e2e:
    needs: [changes, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: extension-chrome-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
          path: ${{ runner.temp }}/extension-zip
      - run: unzip -q "$RUNNER_TEMP"/extension-zip/*-chrome.zip -d "$RUNNER_TEMP/extension"
      - id: playwright
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e e2e
        env:
          E2E_EXTENSION_DIR: ${{ runner.temp }}/extension
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  db-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: skiffr
          POSTGRES_PASSWORD: skiffr
          POSTGRES_DB: skiffr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skiffr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://skiffr:skiffr@localhost:5432/skiffr_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          bun: "true"
      - name: Router tests on postgres
        run: pnpm --filter @skiffr/orpc test
      - name: Test database was dropped
        env:
          PGPASSWORD: skiffr
        run: |
          left=$(psql -h localhost -U skiffr -d skiffr_test -tAc "select count(*) from pg_database where datname like 'skiffr_test_%'")
          echo "$left leftover test databases"
          [ "$left" = "0" ]

  aggregator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - run: bash .github/scripts/aggregate.test.sh

  ci:
    name: ci
    if: always()
    needs: [changes, lint, check-types, test, build, extension, e2e, db-postgres, aggregator-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -ra results <<< "$RESULTS"
          bash .github/scripts/aggregate.sh "${results[@]}"
