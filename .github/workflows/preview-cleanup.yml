name: preview cleanup

# Closing or merging a pull request deletes its whole preview: apps and domains, postgres and its volume, the S3 bucket,
# its registry tags, and marks the github deployments inactive. Safe to run twice. The scheduled sweep (preview-sweep) catches what this misses.

on:
  pull_request:
    types: [closed]

# shares the group of the preview workflow so a running preview is cancelled instead of recreating what is being deleted
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup:
    name: remove preview
    if: vars.PREVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      deployments: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/scripts/preview.mjs down
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          S3_ENDPOINT: ${{ vars.PREVIEW_S3_ENDPOINT }}
          S3_REGION: ${{ vars.PREVIEW_S3_REGION }}
          PREVIEW_S3_ACCESS_KEY_ID: ${{ secrets.PREVIEW_S3_ACCESS_KEY_ID }}
          PREVIEW_S3_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_S3_SECRET_ACCESS_KEY }}
