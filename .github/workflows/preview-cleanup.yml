name: preview cleanup

# Closing or merging a pull request deletes its whole preview: apps and domains, postgres and its volume, the S3 bucket,
# its registry tags, and marks the github deployments inactive. Safe to run twice. The scheduled sweep (preview-sweep) catches what this misses.

on:
  pull_request:
    types: [closed]

# its own group, never the one of the preview workflow, and a cleanup in progress is never cancelled
# (a reopened pull request must not stop half a delete). The preview workflow cancels its own run on close.
concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: remove preview
    # not gated by PREVIEW_ENABLED: turning previews off must still delete what exists
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      deployments: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/scripts/preview.mjs down
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          S3_ENDPOINT: ${{ vars.PREVIEW_S3_ENDPOINT }}
          S3_REGION: ${{ vars.PREVIEW_S3_REGION }}
          PREVIEW_S3_ACCESS_KEY_ID: ${{ secrets.PREVIEW_S3_ACCESS_KEY_ID }}
          PREVIEW_S3_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_S3_SECRET_ACCESS_KEY }}
