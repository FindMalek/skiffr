name: preview sweep

# Daily: removes previews of closed pull requests that cleanup missed, previews idle longer than PREVIEW_TTL_DAYS (default 7)
# even if the pull request is open, and orphans (postgres volumes, buckets) nobody owns. Run it by hand with dry_run to see what it would remove.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: only list what would be removed
        type: boolean
        default: true

concurrency:
  group: preview-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: sweep previews
    if: vars.PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      deployments: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/scripts/preview.mjs sweep ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          PREVIEW_TTL_DAYS: ${{ vars.PREVIEW_TTL_DAYS }}
          S3_ENDPOINT: ${{ vars.PREVIEW_S3_ENDPOINT }}
          S3_REGION: ${{ vars.PREVIEW_S3_REGION }}
          PREVIEW_S3_ACCESS_KEY_ID: ${{ secrets.PREVIEW_S3_ACCESS_KEY_ID }}
          PREVIEW_S3_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_S3_SECRET_ACCESS_KEY }}
