name: drift

# Runs after the real-site smoke job: compares its summary with the committed baselines, writes a drift report,
# keeps one tracking issue with the label `drift` up to date, sends metrics to the optional observability exporters
# and takes a sanitized snapshot of every changed page as an artifact (never committed).
# Only trusts a smoke run that was started by the schedule or by hand, from this repository, on the default branch, from
# .github/workflows/smoke.yml: a pull request can add a workflow named `smoke`, its artifact is never read.
# Skipped until the repository variable DRIFT_ENABLED is "true". Needs no secrets; the exporters are optional:
# variables or secrets OPENOBSERVE_URL, OPENOBSERVE_AUTH, UMAMI_URL, UMAMI_WEBSITE_ID, GLITCHTIP_DSN. Unset ones are skipped.
# The keep's OpenObserve (o2.findmalek.engineer) is tailnet only, so a github hosted runner cannot reach it:
# set OPENOBSERVE_URL only on a tailnet runner or behind a public ingest proxy.

on:
  workflow_run:
    workflows: [smoke]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: id of the smoke run whose artifact to read
        required: true

concurrency:
  group: drift
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  SMOKE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}

jobs:
  drift:
    if: >-
      vars.DRIFT_ENABLED == 'true' && (
      github.event_name == 'workflow_dispatch' || (
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.path == '.github/workflows/smoke.yml'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENOBSERVE_URL: ${{ secrets.OPENOBSERVE_URL || vars.OPENOBSERVE_URL }}
      OPENOBSERVE_AUTH: ${{ secrets.OPENOBSERVE_AUTH }}
      UMAMI_URL: ${{ vars.UMAMI_URL }}
      UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check that the smoke run is ours
        shell: bash
        env:
          RUN_ID: ${{ env.SMOKE_RUN_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # a manual dispatch names the run by hand: it gets the same checks as the workflow_run trigger
          info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '[.event, .head_branch, .head_repository.full_name, .path] | @tsv')
          event=$(printf '%s' "$info" | cut -f1)
          rest=$(printf '%s' "$info" | cut -f2-)
          want=$(printf '%s\t%s\t%s' "$DEFAULT_BRANCH" "$GITHUB_REPOSITORY" ".github/workflows/smoke.yml")
          if [ "$event" != "schedule" ] && [ "$event" != "workflow_dispatch" ]; then echo "smoke run $RUN_ID was started by $event, refusing"; exit 1; fi
          if [ "$rest" != "$want" ]; then echo "smoke run $RUN_ID is not the default branch smoke workflow of this repository, refusing"; exit 1; fi
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        id: smoke
        continue-on-error: true
        with:
          name: smoke-${{ env.SMOKE_RUN_ID }}
          path: ${{ runner.temp }}/smoke
          run-id: ${{ env.SMOKE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Find the previous report
        id: previous
        shell: bash
        run: |
          # the report of the latest earlier run that has one (a run that found drift ends red, so no filter on success)
          for run in $(gh run list --workflow drift.yml --status completed --limit 5 --json databaseId --jq '.[].databaseId'); do
            gh run download "$run" --name "drift-$run" --dir "$RUNNER_TEMP/previous" 2>/dev/null && break
          done
          if [ -f "$RUNNER_TEMP/previous/drift-report.json" ]; then echo "file=$RUNNER_TEMP/previous/drift-report.json" >> "$GITHUB_OUTPUT"; fi
      - id: playwright
        if: steps.smoke.outcome == 'success'
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: steps.smoke.outcome == 'success'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install chromium for the snapshots
        if: steps.smoke.outcome == 'success'
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Write the drift report
        id: report
        if: steps.smoke.outcome == 'success'
        shell: bash
        run: |
          set +e
          args=(report
            --summary "$RUNNER_TEMP/smoke/summary.json"
            --baselines apps/e2e/smoke/baselines
            --targets apps/e2e/smoke/targets.json
            --out "$RUNNER_TEMP/drift"
            --repo "$GITHUB_REPOSITORY"
            --github --export --snapshots)
          if [ -n "${{ steps.previous.outputs.file }}" ]; then args+=(--previous "${{ steps.previous.outputs.file }}"); fi
          pnpm --filter drift drift "${args[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Show the report
        if: always() && steps.smoke.outcome == 'success'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/drift/drift-report.md" ]; then cat "$RUNNER_TEMP/drift/drift-report.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always() && steps.smoke.outcome == 'success'
        with:
          name: drift-${{ github.run_id }}
          path: ${{ runner.temp }}/drift
          retention-days: 30
          if-no-files-found: ignore
      # 0 is the only green: 1 drift or runner errors, 2 an unreadable summary, 3 nothing was verified
      - name: Fail unless the report is clean
        if: always() && steps.smoke.outcome == 'success' && steps.report.outputs.code != '0'
        env:
          CODE: ${{ steps.report.outputs.code }}
        run: |
          echo "drift report exit code ${CODE:-unknown}: 1 drift or runner errors, 2 unreadable summary, 3 nothing verified"
          exit 1
      - name: Fail when there is no smoke summary
        if: always() && steps.smoke.outcome != 'success'
        run: |
          echo "the smoke artifact could not be downloaded, so nothing was checked"
          exit 1
