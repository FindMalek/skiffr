name: release

# Every green push to main is released when it holds a change a user can feel: the next version comes from the squash titles since the
# last tag (scripts/release/lib.mjs, rules in apps/docs/content/docs/releasing.mdx). It builds the four images for amd64 and arm64,
# pushes them to ghcr as vX.Y.Z, X.Y and latest, and publishes a GitHub release with the extension zip, docker-compose.yml, install.sh,
# the skiffr helper and SHA256SUMS. Needs no secret beyond GITHUB_TOKEN and never runs for pull requests or forks.
#
# Run it by hand to force a release or to rehearse one: Actions, release, Run workflow. dry_run builds everything and pushes nothing.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: auto reads the commit titles, the others force that level (a docs-only history still releases)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: build everything, push and publish nothing
        type: boolean
        default: true

# Only runs that will really release take the group. A red or foreign ci completion gets a group of its own and is skipped by the plan
# job, so it can never replace a pending run of a green commit. Runs in the group queue one after the other and are never cancelled.
concurrency:
  group: release-${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) && 'main' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/findmalek/skiffr
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  plan:
    name: plan
    if: >-
      github.repository == 'FindMalek/skiffr' && (
        (github.event_name == 'workflow_dispatch' && (inputs.dry_run || github.ref == 'refs/heads/main')) ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      dry: ${{ steps.decide.outputs.dry }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump || 'auto' }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_run ]; then
            # a newer commit on main will carry these changes, and an older release must never follow a newer one
            tip=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$tip" != "$SHA" ]; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "main moved on to $tip, this run leaves the release to it" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          # a published release of the planned version means it is done, a draft (an interrupted run) is built again
          check=--check-release
          if [ "$DRY" = true ]; then check=; fi
          # shellcheck disable=SC2086
          node scripts/release/plan.mjs --sha "$SHA" --bump "$BUMP" --notes-out RELEASE_NOTES.md $check | tee plan.json
          if [ "$(jq -r .release plan.json)" != true ]; then
            echo "nothing to release: $(jq -r .reason plan.json)" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$DRY" = true ]; then
              # a rehearsal still builds, with a throwaway version
              printf 'release=true\nversion=0.0.0\ntag=v0.0.0\n' >> "$GITHUB_OUTPUT"
              echo "dry run: building as 0.0.0" >> "$GITHUB_STEP_SUMMARY"
              echo "rehearsal build, no release notes" > RELEASE_NOTES.md
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          tag=$(jq -r .tag plan.json)
          printf 'release=true\nversion=%s\ntag=%s\n' "$(jq -r .version plan.json)" "$tag" >> "$GITHUB_OUTPUT"
          { echo "### $tag ($(jq -r '.state // "dry run"' plan.json))"; echo; cat RELEASE_NOTES.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.decide.outputs.release == 'true'
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 7

  extension:
    name: extension zip
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/setup
      - run: node scripts/release/set-version.mjs "$VERSION"
        env:
          VERSION: ${{ needs.plan.outputs.version }}
      - run: pnpm --filter extension zip
      - run: cp apps/extension/.output/*-chrome.zip skiffr-extension.zip
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: skiffr-extension.zip
          retention-days: 7
          if-no-files-found: error

  images:
    name: image ${{ matrix.app }} ${{ matrix.arch }}
    needs: [plan, extension]
    if: needs.plan.outputs.release == 'true'
    # native runners for both architectures: emulating arm64 makes the next builds take an hour
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [api, web, dashboard, docs]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/release/set-version.mjs "$VERSION"
        env:
          VERSION: ${{ needs.plan.outputs.version }}
      - uses: actions/download-artifact@v8
        if: matrix.app == 'api'
        with:
          name: extension-zip
          path: downloads
      - uses: docker/login-action@v4
        if: needs.plan.outputs.dry != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          # pushed by digest, the manifest job tags the two architectures together
          outputs: ${{ needs.plan.outputs.dry == 'true' && 'type=cacheonly' || format('type=image,name={0}-{1},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_PREFIX, matrix.app) }}
          build-args: ${{ matrix.app == 'api' && format('SKIFFR_COMMIT={0}', env.SHA) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=release-${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.app }}-${{ matrix.arch }},mode=max,ignore-error=true
      - name: keep the digest
        if: needs.plan.outputs.dry != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.dry != 'true'
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    name: tag ${{ matrix.app }}
    needs: [plan, images]
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.dry != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web, dashboard, docs]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
      - name: tag vX.Y.Z, X.Y and latest
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          image="$IMAGE_PREFIX-$APP"
          if docker buildx imagetools inspect "$image:v$VERSION" > /dev/null 2>&1; then
            # a rerun after an earlier run tagged the images but did not publish the release: the version tag is never moved,
            # it must come from this commit, and X.Y and latest follow it
            if ! docker buildx imagetools inspect "$image:v$VERSION" --format '{{json .Image}}' | grep -q "\"org.opencontainers.image.revision\": \"$SHA\""; then
              echo "::error::$image:v$VERSION already exists and was not built from $SHA. Image version tags are never moved: fix forward with a new commit, or delete that tag in the package settings if it was never released"
              exit 1
            fi
            docker buildx imagetools create -t "$image:${VERSION%.*}" -t "$image:latest" "$image:v$VERSION"
          else
            cd digests
            sources=$(printf "$image@sha256:%s " *)
            # shellcheck disable=SC2086
            docker buildx imagetools create -t "$image:v$VERSION" -t "$image:${VERSION%.*}" -t "$image:latest" $sources
          fi
          docker buildx imagetools inspect "$image:v$VERSION"
      # Self hosters pull anonymously. A release whose images nobody can pull would break every new install, and install.sh
      # resolves the latest release, so this stops the run before the release is published. Make the package public once, then run again.
      - name: check an anonymous pull works
        env:
          APP: ${{ matrix.app }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:findmalek/skiffr-$APP:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/findmalek/skiffr-$APP/manifests/v$VERSION")
          if [ "$code" != 200 ]; then
            echo "::error::ghcr.io/findmalek/skiffr-$APP is not pullable anonymously (HTTP $code). Make the package public in its settings, then run the release workflow again. Nothing was published"
            exit 1
          fi

  publish:
    name: github release
    needs: [plan, extension, manifest]
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.dry != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/download-artifact@v8
        with:
          name: extension-zip
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: artifacts
      - name: collect assets
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir assets
          mv artifacts/skiffr-extension.zip "assets/skiffr-extension-$TAG.zip"
          cp docker-compose.yml install.sh assets/
          cp scripts/skiffr assets/skiffr
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # The release is a draft until every asset is uploaded, so install.sh (which follows the latest published release) never sees a
      # half uploaded one. A rerun finds the draft, replaces its assets and publishes it.
      - name: create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release list --limit 200 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' | grep -qx "$TAG"; then
            gh release edit "$TAG" --notes-file artifacts/RELEASE_NOTES.md --target "$SHA"
          else
            gh release create "$TAG" --draft --target "$SHA" --title "$TAG" --notes-file artifacts/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" assets/* --clobber
          gh release edit "$TAG" --draft=false --latest
